[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "retailops-ai-intelligence"
version = "0.1.0.dev0"
description = "Local foundation for the RetailOps AI service"
readme = "README.md"
requires-python = ">=3.11.15,<3.12"
license = "MIT"
authors = [{name = "Oskar Stachowski"}]
dependencies = ["pydantic==2.13.5", "pydantic-settings==2.15.0"]

[project.scripts]
retailops-ai = "retailops_ai.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retailops_ai"]

[tool.uv]
required-version = "==0.12.19"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
