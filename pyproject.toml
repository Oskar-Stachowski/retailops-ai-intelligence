[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "retailops-ai-intelligence"
version = "0.1.0.dev0"
description = "Local foundation for the RetailOps AI service"
readme = "README.md"
requires-python = ">=3.11.15,<3.12"
license = "MIT"
authors = [{name = "Oskar Stachowski"}]
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "sqlalchemy[asyncio]==2.1.1",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "markdown-it-py==4.2.0",
    "boto3==1.43.103",
]

[project.scripts]
retailops-ai = "retailops_ai.cli:main"
retailops-ai-snapshot = "retailops_ai.source_snapshot.cli:main"
retailops-ai-curated = "retailops_ai.curated.cli:main"
retailops-ai-forecast = "retailops_ai.forecasting.cli:main"

[project.optional-dependencies]
snapshot = ["pyarrow==25.0.1", "jsonschema==4.26.0"]
forecast = [
    "psutil==7.2.2",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retailops_ai"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/source_snapshot/v1/contract.json" = "retailops_ai/source_snapshot/contract.json"
"contracts/source_snapshot/v1/snapshot_manifest.schema.json" = "retailops_ai/source_snapshot/snapshot_manifest.schema.json"
"uv.lock" = "retailops_ai/source_snapshot/dependencies.lock"
"contracts/curated/v1/curated_manifest.schema.json" = "retailops_ai/curated/curated_manifest.schema.json"
"contracts/forecast/v1/task.schema.json" = "retailops_ai/forecasting/task.schema.json"
"contracts/forecast/v1/calendar_manifest.schema.json" = "retailops_ai/forecasting/calendar_manifest.schema.json"
"contracts/forecast/v1/history_context.schema.json" = "retailops_ai/forecasting/history_context.schema.json"
"contracts/forecast/v1/input_row.schema.json" = "retailops_ai/forecasting/input_row.schema.json"
"contracts/forecast/v1/panel_policy.schema.json" = "retailops_ai/forecasting/panel_policy.schema.json"
"contracts/forecast/v1/feature_policy.schema.json" = "retailops_ai/forecasting/feature_policy.schema.json"
"contracts/forecast/v1/feature_manifest.schema.json" = "retailops_ai/forecasting/feature_manifest.schema.json"
"contracts/forecast/v1/split_policy.schema.json" = "retailops_ai/forecasting/split_policy.schema.json"
"contracts/forecast/v1/split_manifest.schema.json" = "retailops_ai/forecasting/split_manifest.schema.json"
"contracts/forecast/v1/label_point.schema.json" = "retailops_ai/forecasting/label_point.schema.json"
"contracts/forecast/v1/membership.schema.json" = "retailops_ai/forecasting/membership.schema.json"
"contracts/forecast/v1/preprocessing.schema.json" = "retailops_ai/forecasting/preprocessing.schema.json"
"contracts/forecast/v1/features.default.json" = "retailops_ai/forecasting/features.default.json"
"contracts/forecast/v1/split.temporal.default.json" = "retailops_ai/forecasting/split.temporal.default.json"
"contracts/forecast/v1/baseline_policy.schema.json" = "retailops_ai/forecasting/baseline_policy.schema.json"
"contracts/forecast/v1/baseline_prediction.schema.json" = "retailops_ai/forecasting/baseline_prediction.schema.json"
"contracts/forecast/v1/evaluation_manifest.schema.json" = "retailops_ai/forecasting/evaluation_manifest.schema.json"
"contracts/forecast/v1/baselines.default.json" = "retailops_ai/forecasting/baselines.default.json"
"contracts/forecast/v1/model_policy.schema.json" = "retailops_ai/forecasting/model_policy.schema.json"
"contracts/forecast/v1/model_pipeline.schema.json" = "retailops_ai/forecasting/model_pipeline.schema.json"
"contracts/forecast/v1/model_prediction.schema.json" = "retailops_ai/forecasting/model_prediction.schema.json"
"contracts/forecast/v1/model_comparison.schema.json" = "retailops_ai/forecasting/model_comparison.schema.json"
"contracts/forecast/v1/forecast_value.schema.json" = "retailops_ai/forecasting/forecast_value.schema.json"
"contracts/forecast/v1/models.default.json" = "retailops_ai/forecasting/models.default.json"
"contracts/forecast/v1/backtest_policy.schema.json" = "retailops_ai/forecasting/backtest_policy.schema.json"
"contracts/forecast/v1/backtest_manifest.schema.json" = "retailops_ai/forecasting/backtest_manifest.schema.json"
"contracts/forecast/v1/backtest.default.json" = "retailops_ai/forecasting/backtest.default.json"
"contracts/forecast/v1/quality_policy.schema.json" = "retailops_ai/forecasting/quality_policy.schema.json"
"contracts/forecast/v1/quality_manifest.schema.json" = "retailops_ai/forecasting/quality_manifest.schema.json"
"contracts/forecast/v1/segment_metric.schema.json" = "retailops_ai/forecasting/segment_metric.schema.json"
"contracts/forecast/v1/quality.default.json" = "retailops_ai/forecasting/quality.default.json"
"contracts/forecast/v1/run_manifest.schema.json" = "retailops_ai/forecasting/run_manifest.schema.json"
"contracts/forecast/v1/remediation_policy.schema.json" = "retailops_ai/forecasting/remediation_policy.schema.json"
"contracts/forecast/v1/remediation_manifest.schema.json" = "retailops_ai/forecasting/remediation_manifest.schema.json"
"contracts/forecast/v1/remediation.default.json" = "retailops_ai/forecasting/remediation.default.json"
"contracts/forecast/v1/remediation_v2_policy.schema.json" = "retailops_ai/forecasting/remediation_v2_policy.schema.json"
"contracts/forecast/v1/remediation_v2_manifest.schema.json" = "retailops_ai/forecasting/remediation_v2_manifest.schema.json"
"contracts/forecast/v1/remediation_v2.default.json" = "retailops_ai/forecasting/remediation_v2.default.json"
"contracts/forecast/v2" = "retailops_ai/forecasting/v2"
"contracts/forecast/v3" = "retailops_ai/forecasting/v3"
"contracts/curated/v1_1" = "retailops_ai/curated/v1_1"
"contracts/source_snapshot/v1_1" = "retailops_ai/source_snapshot/v1_1"
"contracts/evaluation/v1" = "retailops_ai/evaluation_campaign"
"environments/tensorflow/uv.lock" = "retailops_ai/tensorflow_challenger/dependencies.lock"
"contracts/evaluation/v2" = "retailops_ai/tensorflow_challenger"

[tool.uv]
required-version = "==0.12.19"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"environments/tensorflow/tests/**" = ["S101", "S603"]
"scripts/local_stack.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
