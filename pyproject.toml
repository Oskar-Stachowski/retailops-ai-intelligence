[tool.uv]
required-version = "==0.12.19"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"environments/tensorflow/tests/**" = ["S101", "S603"]
"scripts/local_stack.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
# These byte-identical owner copies run under source_snapshot in a separate
# process. The type-check target below checks that exact runtime namespace.
exclude = ["src/retailops_ai/source_snapshot_native/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
