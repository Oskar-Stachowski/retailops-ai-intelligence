[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "retailops-ai-intelligence"
version = "0.1.0.dev0"
description = "Local foundation for the RetailOps AI service"
readme = "README.md"
requires-python = ">=3.11.15,<3.12"
license = "MIT"
authors = [{name = "Oskar Stachowski"}]
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "sqlalchemy[asyncio]==2.1.1",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "markdown-it-py==4.2.0",
    "boto3==1.43.103",
]

[project.scripts]
retailops-ai = "retailops_ai.cli:main"
retailops-ai-snapshot = "retailops_ai.source_snapshot.cli:main"
retailops-ai-source-bundle = "retailops_ai.source_bundle.cli:main"
retailops-ai-curated = "retailops_ai.curated.cli:main"
retailops-ai-forecast = "retailops_ai.forecasting.cli:main"
retailops-ai-anomaly-inputs = "retailops_ai.anomalies.cli:main"
retailops-ai-raw-dq = "retailops_ai.raw_dq.cli:main"
retailops-ai-full-raw-dq = "retailops_ai.full_raw_dq.cli:main"
retailops-ai-return-inputs = "retailops_ai.return_inputs.cli:main"
retailops-ai-day-qualification = "retailops_ai.day_qualification.cli:main"
retailops-ai-qualified-anomaly-inputs = "retailops_ai.qualified_anomalies.cli:main"
retailops-ai-anomaly-detectors = "retailops_ai.anomaly_detectors.cli:main"
retailops-ai-anomaly-evaluation = "retailops_ai.anomaly_evaluation.cli:main"
retailops-ai-anomaly-operator = "retailops_ai.anomaly_portfolio.operator_cli:main"
retailops-ai-anomaly-batch = "retailops_ai.anomaly_portfolio.batch_cli:main"

[project.optional-dependencies]
snapshot = ["pyarrow==25.0.1", "jsonschema==4.26.0"]
forecast = [
    "psutil==7.2.2",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.build]
# Worktrees use a .git file; packaging must exclude private state explicitly
# even when the build backend cannot recover VCS ignore rules from that layout.
exclude = ["/.local", "/.venv", "/.tools", "/dist", "/reports", "/data/generated"]

[tool.hatch.build.targets.sdist]
# Publish only inputs needed to rebuild the runtime wheel. Runtime state and
# credentials outside this inventory cannot enter an sdist in a worktree.
include = ["/src", "/contracts", "/environments/tensorflow/uv.lock", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/retailops_ai"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/source_snapshot/v1/contract.json" = "retailops_ai/source_snapshot/contract.json"
"contracts/source_snapshot/v1/snapshot_manifest.schema.json" = "retailops_ai/source_snapshot/snapshot_manifest.schema.json"
"uv.lock" = "retailops_ai/source_snapshot/dependencies.lock"
