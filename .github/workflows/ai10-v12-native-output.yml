name: AI10 original v12 Source diagnostic only
on:
  workflow_dispatch:
    inputs:
      archive_secret:
        description: Unused diagnostic input
        required: true
      handoff_sha256:
        description: Unused diagnostic input
        required: true
      origin_date:
        description: Unused diagnostic input
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_NO_CACHE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oskar-Stachowski/retailops-cloud-native-platform
          ref: 1a7f558d718ed3dddaed277c07ccfd7d023f34ce
          path: .local/ai10-native-v12-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.11.15"
          enable-cache: false
      - name: Install exact AI and Source runtimes
        run: |
          uv sync --locked --extra snapshot --extra forecast
          uv sync --locked --project tools/intelligence-delivery
          uv venv --python 3.11.15 .local/ai10-native-v12-source/services/api/.venv
          uv pip install --python .local/ai10-native-v12-source/services/api/.venv/bin/python -r .local/ai10-native-v12-source/services/api/requirements-dev.txt -r .local/ai10-native-v12-source/data/requirements-parquet.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Build exact Source UI and install Chromium
        working-directory: .local/ai10-native-v12-source/frontend
        run: |
          npm ci
          npm run build
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "11493987768"
          run-id: "37636569401"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/prior-artifact
          merge-multiple: true
      - name: Diagnose using original output bytes in explicitly reconstructed SQL
        run: uv run --frozen python scripts/diagnose_ai10_v12_source.py
      - name: Retain bounded diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai10-v12-source-diagnostic-${{ github.sha }}
          path: source-diagnostic/
          if-no-files-found: warn
          retention-days: 7
