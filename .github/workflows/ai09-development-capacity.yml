name: AI09 canonical development capacity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai09-development-capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONNOUSERSITE: "1"
      UV_NO_CACHE: "1"
    steps:
      - name: Checkout exact diagnostic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - name: Checkout frozen native producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oskar-Stachowski/retailops-cloud-native-platform
          ref: 4dacf0403add494f74e4b4f22497f6206de753d9
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.11.15"
          enable-cache: false
      - name: Install locked consumer and pinned producer requirements
        run: |
          uv sync --directory control --locked --extra snapshot --extra forecast
          uv venv --python 3.11.15 source/.venv
          uv pip install --python source/.venv/bin/python \
            -r source/services/api/requirements-dev.txt -r source/data/requirements-parquet.txt
      - name: Measure full ai-dev generation and preparation without model fits
        run: |
          control/.venv/bin/python control/scripts/measure_ai09_development_capacity.py \
            --source "$GITHUB_WORKSPACE/source" --output "$GITHUB_WORKSPACE/diagnostic"
      - name: Preserve measurements and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai09-development-capacity-${{ github.sha }}-${{ github.run_id }}
          path: |
            diagnostic/plan.json
            diagnostic/resource.json
            diagnostic/generation.json
            diagnostic/qualification.json
            diagnostic/export.json
            diagnostic/import.json
            diagnostic/curation.json
            diagnostic/generation.log
            diagnostic/qualification.log
            diagnostic/export.log
            diagnostic/import.log
            diagnostic/curation.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
          overwrite: false
