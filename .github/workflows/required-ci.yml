name: Required CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "ai/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.11.15"
          enable-cache: true
      - run: make bootstrap check
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.11.15"
          enable-cache: true
      - run: make bootstrap compose-smoke
      - run: make mlflow-store-smoke
      - run: make model-lifecycle-smoke
      - run: make lifecycle-store-smoke
      - run: make forecast-queue-smoke
      - run: make forecast-input-store-smoke
      - run: make forecast-publication-smoke
      - run: make forecast-read-smoke
      - run: make model-catalog-smoke
      - run: make evaluations-smoke
      - name: Verify AI10 forecast contracts and transactional outbox
        run: |
          docker pull postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          make integration-replay-test integration-failure-test
      - name: Accept v12 registry, jobs, publication, metadata, backup and recovery
        run: make v12-backup-smoke
  required-result:
    if: always()
    needs: [checks, secrets, persistence]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$CHECKS_RESULT" = "success"
          test "$SECRETS_RESULT" = "success"
          test "$PERSISTENCE_RESULT" = "success"
