name: AI10 qualified stockout output

on:
  push:
    branches: ["ai/10-ready"]
    paths:
      - ".github/workflows/ai10-qualified-output.yml"
      - "src/retailops_ai/intelligence_events/acceptance_export.py"
      - "scripts/check_stockout_final_acceptance.py"
      - "docs/reference/ai10-native-output-consumer.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ai10-qualified-stockout-output-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UV_NO_CACHE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.11.15"
          enable-cache: false
      - run: uv sync --locked --extra snapshot --extra forecast
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68a3ede16da4bd8b93609c2489514c08e95a7384
          path: .local/ai10-original-qualified-runtime
          persist-credentials: false
      - name: Install the original accepted qualifier as an isolated wheel
        run: uv sync --directory .local/ai10-original-qualified-runtime --locked --extra snapshot --extra forecast --no-editable
      - name: Requalify the unchanged model from the six original successful evaluations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked --extra snapshot --extra forecast python scripts/check_stockout_final_permission.py
          uv run --locked --extra snapshot --extra forecast python scripts/recover_stockout_final_receipts.py \
            --request docs/reference/stockout-final-acceptance-request-v1.json \
            --freeze docs/reference/stockout-final-campaign-v2.json --output original-final-receipts
          .local/ai10-original-qualified-runtime/.venv/bin/python scripts/qualify_stockout_final.py \
            --freeze docs/reference/stockout-final-campaign-v2.json \
            --permission docs/reference/stockout-final-permission-v2.json \
            --recipe docs/reference/stockout-final-selected-recipe.json \
            --policy docs/reference/stockout-final-selected-policy-v2.json \
            --receipts original-final-receipts --output final-qualified \
            --final-execution-commit 048f7b311b82dbf831718565289a54166cbe7d36 \
            --final-run-id 37273978383
      - name: Retain genuine qualification independently of later service checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai10-requalified-stockout-${{ github.sha }}
          path: final-qualified/
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Retain preceding successful secret scan and run model boundary tests
        run: |
          mkdir -m 700 acceptance-proofs
          python -c 'import json,os;from pathlib import Path;Path("acceptance-proofs/secrets.json").write_text(json.dumps(dict(passed=True,workflow_run_id=os.environ["GITHUB_RUN_ID"],commit=os.environ["GITHUB_SHA"],scanner="gitleaks-8.30.1",scope="complete_git_history")))'
          uv run --locked --extra snapshot --extra forecast python -m pytest -q \
            tests/test_stockout_final_campaign.py tests/test_stockout_final_scenarios.py \
            tests/test_stockout_campaign_archive.py tests/test_stockout_final_source_preparation.py \
            tests/test_stockout_final_download.py tests/test_stockout_release.py \
            tests/test_stockout_registry.py tests/test_stockout_lifecycle.py \
            tests/test_stockout_batch.py tests/test_stockout_api.py tests/test_stockout_api_startup.py \
            tests/test_stockout_worker.py tests/test_stockout_priority.py \
            tests/test_stockout_final_evidence.py tests/test_stockout_final_card.py \
            tests/test_stockout_balanced_quality.py tests/test_stockout_capacity_comparison.py \
            tests/test_stockout_final_qualification_cli.py tests/test_stockout_public_inputs.py \
            tests/test_stockout_final_acceptance_runner.py tests/test_stockout_final_receipt_recovery.py \
            tests/test_native_model_outbox_export.py \
            --junitxml=acceptance-proofs/tests.xml
      - name: Build the actual locked inference image and owned MLflow image
        run: |
          docker build -f Dockerfile.api -t "retailops-ai10-stockout-acceptance:$GITHUB_SHA" .
          docker build -f Dockerfile.mlflow -t "retailops-ai10-stockout-mlflow:$GITHUB_SHA" .
          docker pull pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
      - name: Review, import and exercise the qualified frozen model on disposable services
        run: |
          QUALIFICATION=$(find final-qualified -type f -name qualification.json -print)
          test -n "$QUALIFICATION"
          uv run --locked --extra snapshot --extra forecast python scripts/check_stockout_final_acceptance.py \
            --qualification "$(dirname "$QUALIFICATION")" \
            --image "retailops-ai10-stockout-acceptance:$GITHUB_SHA" \
            --mlflow-image "retailops-ai10-stockout-mlflow:$GITHUB_SHA" \
            --tests acceptance-proofs/tests.xml --secret-scan acceptance-proofs/secrets.json \
            --output accepted-model
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oskar-Stachowski/retailops-cloud-native-platform
          ref: dc82e2be1e28e250c1af4b6b3f15bb67612d4d1b
          path: .local/ai10-native-output-consumer
          persist-credentials: false
      - name: Verify immutable independent output consumer bytes
        run: |
          python -c 'import hashlib,json,subprocess;from pathlib import Path;pin=json.loads(Path("docs/reference/ai10-native-output-consumer.json").read_text());root=Path(".local/ai10-native-output-consumer");assert subprocess.check_output(["git","rev-parse","HEAD"],cwd=root,text=True).strip()==pin["commit"];assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in pin["sha256"].items())'
      - name: Prepare the independent Source test runtime
        run: |
          uv venv --python 3.11.15 .local/ai10-native-output-consumer/services/api/.venv
          uv pip install --python .local/ai10-native-output-consumer/services/api/.venv/bin/python \
            -r .local/ai10-native-output-consumer/services/api/requirements-dev.txt \
            -r .local/ai10-native-output-consumer/data/requirements-parquet.txt
          docker pull postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          docker pull redpandadata/redpanda:v25.3.6@sha256:ac152ec27adccf9482af2649d293f398eb03c860d7469fc49f86e30d870ea408
      - name: Require original qualified output through broker SQL and authenticated TCP API
        working-directory: .local/ai10-native-output-consumer
        env:
          REQUIRE_BROKER_TESTS: "1"
          REQUIRE_AI10_NATIVE_MODEL_READ: "1"
          AI10_NATIVE_STOCKOUT_OUTPUT: ${{ github.workspace }}/accepted-model
          AI10_NATIVE_PRODUCER_COMMIT: ${{ github.sha }}
          AI10_NATIVE_READ_REPORT: ${{ github.workspace }}/accepted-model/source-native-read.json
        run: |
          services/api/.venv/bin/python -m pytest -q -x \
            services/api/tests/test_native_intelligence_output_durability.py \
            --junitxml="$GITHUB_WORKSPACE/accepted-model/source-native-tests.xml"
      - name: Retain native batch, committed outbox census and actual API examples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai10-qualified-stockout-output-${{ github.sha }}
          path: |
            accepted-model/
            acceptance-proofs/
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
